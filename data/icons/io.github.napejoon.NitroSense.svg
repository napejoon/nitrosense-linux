<?xml version="1.0" encoding="UTF-8"?>
<!-- NitroSense for Linux app icon (original artwork, MIT like the rest of the repository) -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b3b"/>
      <stop offset="0.55" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.5" stop-color="#e60000"/>
      <stop offset="1" stop-color="#8c0000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#e60000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#e60000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e60000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <path id="b" d="M2 -21 C 22 -28 40 -46 46 -70 C 30 -71 12 -60 0 -44 C -5 -36 -5 -26 2 -21 Z"
          fill="url(#blade)"/>
  </defs>

  <!-- hexagon body with red rim (Nitro-style cut corners) -->
  <path d="M128 8 L232 68 L232 188 L128 248 L24 188 L24 68 Z"
        fill="url(#body)" stroke="url(#rim)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M128 30 L213 79 L213 177 L128 226 L43 177 L43 79 Z"
        fill="none" stroke="#4a4a4a" stroke-width="2"/>

  <!-- fan -->
  <g transform="translate(128 128)">
    <circle r="88" fill="url(#glow)"/>
    <circle r="80" fill="none" stroke="#e60000" stroke-width="4" stroke-dasharray="10 7" opacity="0.9"/>
    <use xlink:href="#b" transform="rotate(0)"/>
    <use xlink:href="#b" transform="rotate(40)"/>
    <use xlink:href="#b" transform="rotate(80)"/>
    <use xlink:href="#b" transform="rotate(120)"/>
    <use xlink:href="#b" transform="rotate(160)"/>
    <use xlink:href="#b" transform="rotate(200)"/>
    <use xlink:href="#b" transform="rotate(240)"/>
    <use xlink:href="#b" transform="rotate(280)"/>
    <use xlink:href="#b" transform="rotate(320)"/>
    <circle r="24" fill="#e60000" stroke="#1a1a1a" stroke-width="4"/>
    <circle r="11" fill="#1a1a1a"/>
    <circle r="5" fill="#ff5a50"/>
  </g>
</svg>
